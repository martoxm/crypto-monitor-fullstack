<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Crypto Monitor - Full Stack</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="style.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="background-decor"></div>

    <div class="container">
      <header>
        <h1>CryptoMonitor <span>Live</span></h1>
        <p>Integração de dados via n8n e .NET 10</p>
      </header>

      <div class="price-card">
        <div class="card-header">
          <span class="badge">Bitcoin</span>
          <div class="pulse-indicator"></div>
        </div>
        <div class="price-display">
          <span class="currency">U$</span>
          <span id="btc-price">---</span>
        </div>
        <p class="update-text">
          Última atualização: <span id="last-update">Nunca</span>
        </p>
        <button id="refresh-btn" class="btn-refresh">Atualizar Painel</button>
      </div>
      <section class="chart-section">
        <h2>Variação das Últimas Capturas</h2>
        <div class="chart-container">
          <canvas id="price-chart"></canvas>
        </div>
      </section>
      <div class="history-section">
        <h2>Histórico de Capturas</h2>
        <div class="table-container">
          <table>
            <thead>
              <tr>
                <th>ID</th>
                <th>Moeda</th>
                <th>Preço (USD)</th>
                <th>Data/Hora (UTC)</th>
              </tr>
            </thead>
            <tbody id="history-table-body"></tbody>
          </table>
        </div>
      </div>
      <footer>
        <p>© 2026 CryptoMonitor. Desenvolvido por Gabriel Martorelli</p>
        <div id="social-links">
          <a
            href="https://github.com/martoxm"
            target="_blank"
            rel="noopener noreferrer"
            title="GitHub"
          >
            <i class="fab fa-github"></i>
          </a>
          <a
            href="https://www.linkedin.com/in/gabrielmartorelli/"
            target="_blank"
            rel="noopener noreferrer"
            title="LinkedIn"
          >
            <i class="fab fa-linkedin"></i>
          </a>
          <a
            href="https://www.instagram.com/marto.dev/"
            target="_blank"
            rel="noopener noreferrer"
            title="Instagram"
          >
            <i class="fab fa-instagram"></i>
          </a>
        </div>
      </footer>
    </div>

    <script src="app.js"></script>
  </body>
</html>
